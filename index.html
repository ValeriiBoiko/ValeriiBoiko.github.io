<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>TrainHub: Workout & Calorie Tracker - Fitness App for Trainers & Clients</title>
  <meta name="title" content="TrainHub: Workout & Calorie Tracker - Fitness App for Trainers & Clients" />
  <meta name="description" content="A smarter way for trainers and clients to work together. Plan workouts, track calories, and grow as a team with TrainHub - the ultimate fitness tracking app." />
  <meta name="keywords" content="TrainHub, workout tracker, calorie counter, fitness app, trainer app, client management, workout planning, fitness tracking" />
  <meta name="author" content="TrainHub" />
  <meta name="robots" content="index, follow" />
  <meta name="language" content="English" />
  <meta name="revisit-after" content="7 days" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://thapp.pro/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thapp.pro/" />
  <meta property="og:title" content="TrainHub: Workout & Calorie Tracker - Fitness App for Trainers & Clients" />
  <meta property="og:description" content="A smarter way for trainers and clients to work together. Plan workouts, track calories, and grow as a team with TrainHub." />
  <meta property="og:image" content="https://thapp.pro/images/app-icon.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="TrainHub" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://thapp.pro/" />
  <meta name="twitter:title" content="TrainHub: Workout & Calorie Tracker - Fitness App" />
  <meta name="twitter:description" content="A smarter way for trainers and clients to work together. Plan workouts, track calories, and grow as a team." />
  <meta name="twitter:image" content="https://thapp.pro/images/app-icon.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./images/app-icon.png" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "TrainHub: Workout & Calorie",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "iOS, Android",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.5"
    },
    "description": "A smarter way for trainers and clients to work together — plan, track, and grow as a team",
    "screenshot": "https://thapp.pro/images/app-icon.png",
    "url": "https://thapp.pro/"
  }
  </script>

  <!-- Structured Data - WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "TrainHub",
    "url": "https://thapp.pro/",
    "description": "TrainHub: Workout & Calorie Tracker - Fitness App for Trainers & Clients",
    "publisher": {
      "@type": "Organization",
      "name": "TrainHub",
      "logo": {
        "@type": "ImageObject",
        "url": "https://thapp.pro/images/logo.png"
      }
    }
  }
  </script>
</head>

<body>
  <main class="container">
    <div class="logo">
      <img src="./images/app-icon.png" alt="TrainHub Logo - Fitness and Workout Tracking App" width="80" height="80" />
    </div>
    <h1 class="app-name">
      <img src="./images/logo.png" alt="TrainHub - Workout & Calorie Tracker" width="200" height="24" />
    </h1>
    <p class="tagline">
      A smarter way for trainers and clients to work together — plan, track,
      and grow as a team
    </p>

    <section class="download-section" aria-label="Download TrainHub App">
      <h2 class="section-title">Download the app</h2>
      <div class="store-buttons">
        <button class="store-btn" onclick="downloadFromStore('ios')" aria-label="Download TrainHub from App Store">
          <img src="./images/apps-store-logo.png" alt="Download TrainHub on the App Store" width="120" height="45" />
        </button>
        <button class="store-btn" onclick="downloadFromStore('android')" aria-label="Download TrainHub from Google Play Store">
          <img src="./images/play-store-logo.png" alt="Get TrainHub on Google Play" width="135" height="45" />
        </button>
      </div>
    </section>

    <section class="open-section" aria-label="Open TrainHub App">
      <h2 class="section-title">Already have the app?</h2>
      <button class="btn btn-primary open-btn" onclick="openApp()" aria-label="Open TrainHub app">
        Open It!
      </button>
    </section>

    <div class="loading" id="loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      Redirecting to app store...
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="./support.html" rel="nofollow">Support</a>
      <span class="footer-separator" aria-hidden="true">|</span>
      <a href="./privacy-policy.html">Privacy Policy</a>
      <span class="footer-separator" aria-hidden="true">|</span>
      <a href="./terms.html">Terms of Use</a>
    </nav>
    <p>&copy; <span id="current-year"></span> TrainHub: Workout & Calorie. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Set current year in footer
    document.getElementById("current-year").textContent = new Date().getFullYear();
  </script>
</body>

</html>
